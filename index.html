<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Sudoku</title>
</head>
<body>
<main>
  <header>
    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <span id="timer" aria-live="off">0:00</span>
    <button id="new" type="button">New</button>
  </header>
  <div id="board" role="grid" aria-label="Sudoku board"></div>
  <p id="message" role="status"></p>
  <nav id="tools">
    <button id="undo" type="button">Undo</button>
    <button id="erase" type="button">Erase</button>
    <button id="notes" type="button" aria-pressed="false">Notes</button>
  </nav>
  <nav id="pad"></nav>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
